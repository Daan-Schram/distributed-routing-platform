<aside class="sidebar">
  <div class="sidebar-header">Experiments</div>
  <div class="sidebar-filters" id="sidebar-filters" style="display:none">
    <input class="sidebar-search" id="sidebar-search" type="search" placeholder="Search runs, networks, groups…" autocomplete="off">
    <div class="filter-block" id="filter-block-algorithm" style="display:none">
      <div class="filter-label">Algorithm</div>
      <div class="filter-group" id="filter-algorithm"></div>
    </div>
    <div class="filter-block" id="filter-block-network" style="display:none">
      <div class="filter-label">Network</div>
      <div class="filter-group" id="filter-network"></div>
    </div>
  </div>
  <div class="sidebar-list" id="sidebar-list">
    <div style="padding:20px;color:var(--text-dim);font-size:13px;">Loading…</div>
  </div>
  <div style="padding:10px 12px; border-top:1px solid var(--border); background:var(--surface2); flex-shrink:0;">
    <button id="delete-all-btn" style="width:100%; padding:6px; border-radius:5px; border:1px solid var(--border); background:var(--surface); color:var(--red); font-size:11px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px;">Delete all experiments</button>
  </div>
</aside>
